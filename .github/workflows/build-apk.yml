name: Build & Release LightNYCSubway APK

# Auto-builds the LightNYCSubway tool and attaches a signed debug APK to a GitHub
# Release on every push to main (and on manual dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'examples/LightNYCSubway/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # create releases + upload the APK asset
  packages: read    # pull the Light SDK libraries from GitHub Packages

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          # Light SDK libraries live in lightphone's GitHub Packages.
          # Add these two repo secrets (Settings > Secrets and variables > Actions):
          #   GH_PACKAGES_USER  = your GitHub username (gi-os)
          #   GH_PACKAGES_TOKEN = a PAT with read:packages
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ secrets.GH_PACKAGES_USER }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :examples:LightNYCSubway:assembleDebug --stacktrace --no-daemon

      - name: Collect APK + version
        id: apk
        run: |
          apk=$(find examples/LightNYCSubway/build/outputs/apk -name '*.apk' | head -n1)
          ver=$(grep -E '^versionName' examples/LightNYCSubway/lighttool.toml | sed -E 's/.*"([^"]+)".*/\1/')
          out="LightNYCSubway-v${ver}-build${{ github.run_number }}.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Built $out from $apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build.${{ github.run_number }}
          name: LightNYCSubway v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build of the **nyc-subway** Light Phone III tool.
            Commit ${{ github.sha }}.
            Download the `.apk` below and sideload via `adb install`.
          files: ${{ steps.apk.outputs.file }}
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
